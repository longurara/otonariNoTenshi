                - generic:
                  - paragraph: “… Cậu đang làm gì thế?”
                  - paragraph: Lần đầu tiên Fujimiya Amane bắt chuyện với cô gái ấy,Shiina Mahiru, là khi trông thấy cô ngồi xích đu trong công viên giữa trời mưa tầm tã.
                  - paragraph: Ngay bên phải căn chung cư mà cậu chuyển đến sống một mình từ khi lên lớp 10, có một thiên sứ đang trú ngụ nơi đây.
                  - paragraph: Dĩ nhiên, thiên sứ chỉ là cách nói ví von,song Shiina Mahiru quả thực là cô gái khả ái đến mức lối ví von đó không hề là nói đùa .
                  - paragraph: Mái tóc suôn thẳng được chải chuốt tỉ mỉ của Mahiru luôn mượt mà, óng ả, làn da trắng đến mức tưởng như trong suốt trông lúc nào cũng mịn màng. Sống mũi thẳng tắp, đôi mắt to tròn với hàng mi dài và đôi môi màu anh đào căng mọng. Tất thảy những đường nét ấy đã tạc nên gương mặt của một thiên thần có vẻ đẹp tinh tế đầy tự hào.
                  - paragraph: Vì học chung trường nên Amane vẫn thường nghe nhiều lời đánh giá về Mahiru từ các bạn học, phần lớn đều nhận xét cô là kiểu người tài sắc vẹn toàn.
                  - paragraph: Quả thực cô luôn đạt hạng nhất trong các bài kiểm tra định kì, thành tích trong giờ thể dục cũng thuộc cấp S . Amane học khác lớp nên không được rõ lắm, nhưng nếu đúng như lời đồn đại, cô ấy hẳn phải là một siêu nhân hoàn hảo lắm.
                  - paragraph: Một cô nàng với gương mặt xinh đẹp và thành tích ưu tú, không tìm được chút khuyết điểm nào, chẳng những thế tính cách lại điềm đạm, khiêm nhường , việc cô được yêu mến cũng là điều dễ hiểu.
                  - paragraph: Có cô gái tuyệt vời như thế sống cạch bên là điều mà chắc chắn nhiều tên con trai sẽ thấy ganh tị, thèm thuồng.
                  - paragraph: Thế nhưng, Amane lại không hề có ý định làm thân với Mahiru.
                  - paragraph: Tất nhiên Amane cũng thấy Shiina Mahiru rất có sức thu hút.
                  - paragraph: Nhưng đối với cậu, cô ấy chỉ là một người hàng xóm. Amane chưa từng có dự định gì liên quan đến cô , khi ngay cả có cơ hội để họ nói chuyện bình thường cũng không có.
                  - paragraph: Dính dáng đến cô chỉ khiến tụi con trai thêm đố kị với cậu,hơn nữa nếu cậu chỉ cần sống cạnh nhà mà có thể làm thân được thì đám mến mộ cô ấy đã chẳng phải cực khổ đến vậy.
                  - paragraph: Dù thế nào, sự thu hút lẫn nhau giữa những người khác giới không hẳn sẽ tương ứng với tính cảm yêu đương, và đối với Amane, Mahiru là một cô gái xinh đẹp chỉ phù hợp để ngắm nhìn.
                  - paragraph: Bởi vậy, cậu chẳng hề mong đợi sẽ có được mối quan hệ tình cảm nào với cô, chỉ cần là những người hàng xóm không va chạm nhau là được.
                  - paragraph: Nhưng khi bắt gặp cô ngồi một mình giữa màn mưa với vẻ sầu não thế này, cậu đã không thể ngừng chú ý đến cô như thể trông thấy một người khả nghi và tự hỏi không biết người đó đang làm gì.
                  - paragraph: Cơn mưa dữ dội khiến ai cũng gấp rút trở về nhà , vậy mà cô lại một mình ngồi xích đu trong khu công viên nằm giữa trường học và chung cư.
                  - paragraph: Cô ấy đang làm gì giữa cơn mưa thế này?
                  - paragraph: Dưới bầu trời nặng mây màu tro đậm không có lấy một tia nắng, màn mưa ảm đạm không ngừng trút xuống từ sáng khiến tầm nhìn mở mịt đi , nhưng cậu vẫn nhận ra Mahiru ngay nhờ màu tâu nâu vàng nhạt nổi bật cùng bộ đồng phục.
                  - paragraph: Cậu không hiểu tại sao cô ấy lại ở đây, không che ô mà cứ dầm mưa như vậy.
                  - paragraph: Có vẻ không phải cô ấy đang đợi ai, ánh mắt Mahiru thẫn thờ nhìn về nơi nào đó như chẳng để tâm đến chuyện bị ướt.
                  - paragraph: Gương mặt hơi ngẩng lên của cô vốn dĩ nhạt màu nhưng sắc mặt khá tệ, thậm chí là có vẻ tái xanh.
                  - paragraph: Nếu không cẩn thận là có thể bị cảm ngay. Vậy mà Mahiru vẫn lặng lặng ngồi đó.
                  - paragraph: Trông cô ấy chẳng hề có ý định trở về nhà, không chừng là vì cô ấy thích thế. Người ngoài có lẽ không cần phải lên tiếng.
                  - paragraph: Nghĩ vậy, Amane đã định lướt ngang qua công viên…Nhưng khi thấy gương mặt méo mó như sắp khóc của Mahiru , cậu khẽ đưa tay gãi đầu.
                  - paragraph: Cậu không hề có ý muốn tiếp cận cô.
                  - paragraph: Chỉ là, lương tâm cậu sẽ cắn rứt lắm nếu bỏ mặt một cô gái đang có tâm tư như vậy giữa màn mưa. Chỉ vậy thôi.
                  - paragraph: “…Cậu đang làm gì thế?”
                  - paragraph: Khi Amane cất tiếng một cách lạnh lùng nhất có thể, để thể hiện rằng cậu không có ý gì khác, Mahiru khẽ rũ mái tóc dài trĩu nặng vì đẫm nước, ngước lên nhìn cậu.
                  - paragraph: Vẫn như mọi khi, gương mặt cô thật đẹp.
                  - paragraph: Dù thấm đẫm nước mưa, vầng sáng lấp lánh ấy vẫn không hề lu mờ, thậm chí màn mưa còn trở thành chất xúc tác khiến cho gương mặt cô càng nổi bật hơn. Quả là cô gái xinh đẹp vô vàn. Đôi mắt sáng ngời của Mahiru nhìn về phía Amane.
                  - paragraph: Ít nhất, Mahiru có nhận ra Amane là hàng xóm cạnh bên, và cả hai đã từng có lúc đi lướt qua nhau vào buổi sáng.
                  - paragraph: Chỉ là đột nhiên bị một người chẳng có chút liên hệ trực tiếp nào bắt chuyện, dôi mắt màu caramel khẽ ánh lên vẻ cảnh giác
                  - paragraph: “Fujimiya, cậu có chuyện gì sao?”
                  - paragraph: Amane có một cảm giác rất lạ khi thấy cô ấy nhớ tên mình, song đồng thời cậu cũng hiểu rằng điều đó sẽ không khiến cô buông lơi cảnh giác.
                  - paragraph: Quả thực, bị một người xa lạ nhưng không hẳn là không quen biết bắt chuyện, cô ấy đề cao cảnh giác là điều dễ hiểu thôi.
                  - paragraph: Cũng có thể cô ấy không muốn dính dáng gì đến những gã khác giới. Nghe nói cô ấy thường bị nam sinh ở các khối khác lớp trong trường tiếp cận hoặc tỏ tình, có lẽ cô cho rằng cậu đang có ý đồ nào đó.
                  - paragraph: “Không hẳn, tôi chỉ thắc mắc cậu một mình dầm mưa thế này để làm gì”
                  - paragraph: “Vậy à. Cảm ơn cậu đã quan tâm, tôi ở đây vì tôi thích thế, cậu đừng để ý đến chuyện của tôi.”
                  - paragraph: Đó không phải giọng nói sắc bén đầy cảnh giác, mà là một chất giọng lạnh nhạt, dẫu nhẹ nhàng song lại hoàn toàn không có chút mở lòng.
                  - paragraph: Lí do đã rõ ràng, vẻ mặt cô ấy cũng thể hiện rằng cô từ chối để cậu can dự vào chuyện này, thế nên Amane không có ý muốn dấn sâu thêm nữa.
                  - paragraph: Nhưng chuyện này cũng giống như tình thế đưa đẩy khiến cậu phải bắt chuyện với cô. Việc cậu hỏi thăm sự tình chỉ đơn giản là thuận theo hoàn cảnh chứ không hẳn là cậu quan tâm cô ấy.
                  - paragraph: Nếu cô ấy đã muốn ở đây, vậy cũng được thôi.
                  - paragraph: Cậu cũng hiểu rằng Mahiru chắc chắn đang thắc mắc vì sao cậu lại bắt chuyện với cô ấy.
                  - paragraph: Trước gương mặt xinh đẹp đang nhìn cậu đầy nghi hoặc, Amane chỉ đáp ngắn gọn,” Vậy à.”
                  - paragraph: Nếu còn tiếp tục hỏi thêm nữa, chắc chắn cậu sẽ bị ghét cho xem, cứ nên rút lui thì hơn.
                  - paragraph: Cũng may việc Mahiru nghĩ tốt hay xấu chẳng liên quan gì đến Amane, cậu có thể dứt khoát buông bỏ chuyện này mà trở về nhà.
                  - paragraph: Nhưng nếu để mặc một cô gái ướt mèm một mình ngồi đây, quả thật cậu thấy có chút không thoải mái.
                  - paragraph: “Cậu sẽ bị cảm đấy, che cái này rồi về nhà đi. Không cần trả lại tôi cũng được.”
                  - paragraph: Thế đấy, rốt cuộc cậu vẫn làm cái chuyện bao đồng thêm lần chót.
                  - paragraph: Cậu sẽ cắn rứt lắm nếu cô ấy bị cảm lạnh hoặc sao đó, vì vậy cậu đã đưa cho cô chiếc ô vẫn đang che trên đầu mình.
                  - paragraph: Sau khi Mahiru nhận lấy, hay nói đúng hơn là bị ép nhận lấy, Amane vội quay lưng đi trước khi cô kịp mở lời.
                  - paragraph: Vừa nhanh chân rời đi, phía sau lưng cậu bỗng vang lên giọng nói của Mahiru.
                  - paragraph: Thế nhưng âm thanh nhỏ nhẹ đó đã bị át hẳn trong tiếng mưa, Amane cứ thế mau chóng rời khỏi công viên.
                  - paragraph: Cô ấy không bị cảm thì tốt...
                  - paragraph: Không biết có phải vì cậu đã đưa chiếc ô của mình cho cô hay không mà cảm giác tội lỗi ban đầu khi định cứ mặc kệ mà lướt qua đã phần nào vơi bớt.
                  - paragraph: Cô ấy đã từ chối giao tiếp rồi, thôi thì Amane cũng không có ý định sẽ liên can gì nữa.
                  - paragraph: Dù sao cũng không có duyên với nhau, chấm dứt ở đây thôi.
                  - paragraph: Amane thầm nghĩ khi cất bước trên con đường trở về nhà.
