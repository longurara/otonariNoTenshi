                  - paragraph: Hayase cũng là một trong số những người đang xì xụp kia. Cô ấy ăn nốt miếng mì, mặt như kiểu “huh, mình á?”
                  - paragraph: Khi mọi người xung quanh giục, cô đứng dậy, tay che miệng vẫn đang còn nhai. Tay còn lại thì vuốt tóc như thấy khó chịu.
                  - paragraph: Những ánh nhìn tò mò đổ dồn vào cô học sinh ấy.
                  - paragraph: Anh chàng kia thì đưa tay ra vuốt tóc cô với ánh nhìn chắc chắn, còn cô thì chẳng để tâm chút nào, chỉ láo liên nhìn xung quanh, hẳn là đang xấu hổ. Không có vẻ gì là họ sẽ nhìn vào mắt nhau sớm đâu.
                  - paragraph: Anh ta lấy một hơi thật sâu.
                  - paragraph: “Anh chưa bao giờ yêu từ cái nhìn đầu tiên, nhưng lần này thì khác. Em sẽ hẹn hò với anh chứ?”
