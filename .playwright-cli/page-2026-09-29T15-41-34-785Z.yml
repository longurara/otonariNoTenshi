          - paragraph [ref=f3e417]: Hẳn là cô ấy muốn được tự mình nhìn thấy, vì cô men theo vạch dẫn chạy xuống dốc, nhưng rồi đột nhiên cô trượt tay, mất thăng bằng.
          - paragraph [ref=f3e418]: “Cẩn thận!” Tôi hét lên, theo bản năng lao tới đỡ.
          - paragraph [ref=f3e419]: Tôi giúp Fuyutsuki đứng vững lại. Bàn tay cô ấy thật lạnh lẽo khi chạm vào tay tôi.
          - paragraph [ref=f3e420]: “Tay cậu ấm thật đấy Sorano.” Cô bình thản nói.
          - paragraph [ref=f3e421]: “Cậu đã có thể bị thương đấy.”
          - paragraph [ref=f3e422]: “Mình xin lỗi.”
          - paragraph [ref=f3e423]: “Không sao đâu.”
          - paragraph [ref=f3e424]: Khi tôi giúp cô ấy đứng thẳng dậy, thì pháo hoa cũng đã hết.
          - paragraph [ref=f3e425]: “Lỡ mất rồi nhỉ?” Cô cười nói.
          - paragraph [ref=f3e426]: “Cậu thấy được à?” Tôi hỏi, cảm giác có gì đó lạ.
