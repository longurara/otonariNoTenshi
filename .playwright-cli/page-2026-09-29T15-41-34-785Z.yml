                  - paragraph: “Ý mày là sao?”
                  - paragraph: “Thì là ấy, tự nhìn mày xem. Lưng tựa vào tường, không chịu nhúc nhích gì hết. Trong khi mọi người ở đây đều đang cố gắng xây dựng các mối quan hệ.”
                  - paragraph: “Cái sự cố gắng đấy làm tao thấy–“
                  - paragraph: Tôi chưa kịp dứt lời, thì có tiếng vỗ tay ở bàn trước.
                  - paragraph: “Mọi người chú ý chút được không ạ?”
                  - paragraph: Hình như là trưởng câu lạc bộ nào đó, nhưng tôi chả nhớ nổi. Âm nhạc hay thể thao gì đấy. Chắc không phải câu lạc bộ tennis đâu, nhưng mà cũng có thể. Dù sao thì, một anh chàng với mái tóc nâu sáng, tỏa ra toàn khí chất của một trai chơi đứng dậy.
                  - paragraph: “Tôi có thông báo quan trọng này cần nói!”
                  - paragraph: Giọng anh ta đầy tự tin – kiểu người như chưa từng gặp chuyện gì khó khăn trong cuộc sống ấy. Nói thật thì, tôi thấy khó chịu với cái sự tự tin thái quá đấy. Có lẽ người khác sẽ thấy buồn cười chăng, vì tôi nghe có tiếng cười đâu đây rồi.
                  - paragraph: Khoảng lặng anh ta tạo ra thu hút sự chú ý của mọi người… hoặc là do tôi nghĩ thế. Thay vào đó, họ bắt đầu lao vào món champon đã nguội lạnh, tiếng xì xụp nghe được từ khắp các góc phòng.
                  - paragraph: Nhưng anh ta nào để chút tiếng ồn này ngăn cản. Dù không thể làm ra vẻ gì hơn nữa, nhưng kiểu gì anh ta cũng phải công bố cái thông báo kia cho bằng được. Dù chẳng biết là anh ta say quá nên không nghe thấy hay tinh thần thép nữa.
