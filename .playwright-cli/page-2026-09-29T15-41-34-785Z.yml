          - paragraph [ref=f3e381]: “Gần đây mình đã cẩn thận hơn không để xe đạp ở vạch dẫn đường rồi. Người ta cần phải biết để ý hơn, cái này quan trọng lắm đấy.”
          - paragraph [ref=f3e382]: “Phải rồi.” Tôi đáp lại như một cái máy.
          - paragraph [ref=f3e383]: “Đúng đấy!” Hayase gắt gỏng.
          - paragraph [ref=f3e384]: Và rồi, vẫn giữ vẻ khó chịu đó, cô ấy tiếp tục chuyện hồi nãy.
          - paragraph [ref=f3e385]: “Vậy cậu nghĩ sao về chuyện đó?”
          - paragraph [ref=f3e386]: Tôi đã mong chiếc xe đạp đổ kia có thể giúp mình thoát khỏi chuyện này, nhưng không may làm sao.
          - paragraph [ref=f3e387]: “Hmm.” Tôi giả vờ suy nghĩ. “Cho mình chút thời gian suy nghĩ nhé.” Tôi ngắn gọn nói.
          - paragraph [ref=f3e388]: Ý tôi là một lời từ chối gián tiếp đấy, nhưng Hayase không chịu rút lui.
          - paragraph [ref=f3e389]: “Cho tớ thông tin liên lạc đi.” Cô nói, giơ mã QR ra để kết bạn trên LINE. Tôi do dự quét ID của Hayase. Xong việc, cô ấy cười nói “Nhớ giúp Koharu khi nào cậu ấy cần gì đó nhé.” rồi chạy lại chỗ Fuyutsuki.
          - paragraph [ref=f3e390]: Tệ thật mà.
          - paragraph [ref=f3e391]: “Nhưng –“
          - paragraph [ref=f3e392]: Tôi suýt thì nói “Mình không giỏi mấy việc này đâu,” nhưng đã dừng lại lúc cuối.
          - paragraph [ref=f3e393]: Hồi còn nhỏ, tôi từng chuyển nơi sống khắp nơi, từ nhà này đến nhà khác.
          - paragraph [ref=f3e394]: Đó là cách duy nhất mà một người mẹ đơn thân đã li dị có thể nuôi nấng được đứa con này.
          - paragraph [ref=f3e395]: Chúng tôi bắt đầu ở nhà ông bà, nhưng khi ông bà yếu thì chúng tôi lại đến nhà dì. Rồi sau khi mẹ và dì cãi nhau, chúng tôi lại đến ở nhà một người họ hàng xa. Rồi đến một lúc nào đó, một người bạn của mẹ đã cho chúng tôi ở cùng dù không họ hàng gi hết.
          - paragraph [ref=f3e396]: Đi đâu cũng thế, tôi luôn bị ghét vì “quá kiêu ngạo.” Khi tôi tỏ ra ngoan ngoãn thì lại bị ghét vì “quá ngoan hiền.” Trở nên nổi bật, là cách để một ai đó chắc chắn bị ghét, ở tất cả những ngôi trường mà tôi đã chuyển đến – nhưng khi tôi giữ mình, thì không ai nói gì cả. Rốt cuộc, họ cũng chỉ thích những thứ vô hại thôi.
          - paragraph [ref=f3e397]: Tôi đã học được rằng biết hòa nhập và tránh xa những mối quan hệ rắc rối là cách tốt nhất. Và từ lúc nào, tôi đã thành chuyên gia đọc tâm trạng qua vẻ mặt, cố gắng sống ẩn mình và biết được những vùng an toàn của mình và người khác.
          - paragraph [ref=f3e398]: Tôi nhìn lên mặt trăng, giờ đã bị màn sương che phủ. Chỉ thấy được đường nhét mờ ảo, ánh trăng nhẹ khiến tòa nhà sáng lên bí ẩn. Cảnh tượng đẹp đẽ, nhưng xen vào đó là sự cứng nhắc, lạnh lẽo của bê tông khiến tôi thấy hơi chút khó chịu.
          - paragraph [ref=f3e399]: “Oh, là tòa này phải không?” Hayase đứng lại hỏi.
          - paragraph [ref=f3e400]: Bọn tôi đã đến cầu Aioi. Trường đại học nằm phía bên kia.
          - paragraph [ref=f3e401]: “Chỗ này đẹp thật đấy nhỉ?” Narumi nhìn lên tòa phức hợp nói.
          - paragraph [ref=f3e402]: Trước mặt bọn tôi là hai tòa nhà cao năm mươi tầng. Cả hai đều trông như những khu căn hộ cao cấp. Có một câu thang ngắn và đường dốc dành cho xe lăn dẫn đến một đoạn đường dài khác, cuối lối vào là cổng cùng đài phun nước, rõ ràng đây là một nơi sang trọng. Fuyutsuki toát lên vẻ gọn gàng thanh lịch, và điều này đã xác nhận ấn tượng của tôi về cô là một tiểu thư nhà giàu.
          - paragraph [ref=f3e403]: Hayase dắt tay Fuyutsuki lên. Cô đặt gậy trắng lên vạch dẫn đường, rồi lịch sự cúi đầu.
          - paragraph [ref=f3e404]: “Cảm ơn mọi người.”
          - paragraph [ref=f3e405]: “Ngủ ngon nhé.”
          - paragraph [ref=f3e406]: “Hẹn gặp lại.”
          - paragraph [ref=f3e407]: “Chúc ngủ ngon.”
          - paragraph [ref=f3e408]: Bọn tôi vẫy tay chào tạm biệt nhau.
          - paragraph [ref=f3e409]: Và lúc ấy.
          - paragraph [ref=f3e410]: Bọn tôi nghe tiếng nổ, anh đỏ phản chiếu trên cửa kính tòa nhà.
          - paragraph [ref=f3e411]: Bùm, bùm. Từng tiếng nổ liên hồi. Mỗi một lần nổ, tòa nhà lại ánh lên sắc màu – vàng, xanh rồi lại đỏ.
          - paragraph [ref=f3e412]: Narumi chỉ qua phía bên kia cầu Aioi.
          - paragraph [ref=f3e413]: “Hình như là ở bên kia.”
          - paragraph [ref=f3e414]: Hayase quay lại nhìn lên trời.
          - paragraph [ref=f3e415]: “Ở đó là bên trường mà? Họ được phép bắn pháo hoa ở đó à?”
