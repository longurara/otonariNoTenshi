                  - paragraph: Anne Frank, ngày 5 tháng 4 năm 1944
                  - paragraph: 1. Lần đầu gặp gỡ
                  - paragraph: Vị bác sĩ đứng bên giường bệnh, hai tay đặt sau lưng.
                  - paragraph: Những đóa hoa đặt trên khung cửa sổ, cánh hoa trắng tản ra trên thân hoa dài mỏng.
                  - paragraph: Như pháo hoa bung nở trên bầu trời đêm vậy. Mỗi khi tấm rèm trắng phấp phới vì gió thoảng, tôi lại ngửi thấy mùi hương ngọt ngào từ những bông hoa ấy.
                  - paragraph: Vị bác sĩ tiếp lời.
                  - paragraph: Tôi đáng ra đã phải chuẩn bị trước khi đối mặt với những lời ấy – nhưng giọng tôi vẫn hòa lẫn vào những giọt nước mắt.
                  - paragraph: “Như vậy đã đủ rồi ạ. Dừng lại ở đây thôi.”
                  - generic: • • •
                  - paragraph: Khi tôi đang gật gù, thì Narumi lớn giọng làm tôi tỉnh lại.
                  - paragraph: Hẳn là cậu ta vừa đùa câu gì đó học được ở Kansai. Tôi mở mắt thấy mọi người xung quanh đang vừa cười vừa vỗ tay.
                  - paragraph: Hình như tôi vừa lỡ mất một câu đùa của cậu ta nhỉ, mà cũng chẳng sao. Thật ra tôi còn đang thấy hơi bực vì bị đánh thức cơ. Tôi thúc cùi trỏ vào hông khi cậu ta ngồi xuống.
                  - paragraph: “Oh, Sorano, tỉnh rồi đấy à.”
                  - paragraph: Narumi vỗ lưng tôi vui vẻ.
                  - paragraph: “Tao vừa mới có một giấc mơ kỳ lạ lắm.”
                  - paragraph: “Kiểu gì?”
                  - paragraph: “Kiểu trầm cảm cực.”
                  - paragraph: “Ý là sao?”
                  - paragraph: Bọn tôi đang ở một bữa tiệc được tổ chức bởi các thành viên thuộc nhiều câu lạc bộ khác nhau để chào đón người mới.
                  - paragraph: Tôi ngồi cạnh Narumi – người đã lôi tôi đến đây – trong góc phòng. Ở đây có thể thấy toàn bộ xung quanh.
                  - paragraph: Tôi chẳng có chút hứng thú gì với bữa tiệc này cả, lại còn đang thiếu ngủ nữa chứ.
                  - paragraph: “Thôi vui lên nào? Mày đã lết được đến đây rồi thì phải tận hưởng đi chứ.”
                  - paragraph: “Có phải tao muốn đến đâu. Là mày ép mà.”
                  - paragraph: Narumi là bạn cùng phòng ký túc xá đại học của tôi. Cậu ta đã đề xuất ‘dọn dẹp nâng cấp phòng ở’ tối hôm qua, và tôi đã làm quần quật đến tận sáng nay.
                  - paragraph: Nhờ đó mà giờ tôi đang cực kỳ buồn ngủ. Cứ nghĩ sau mấy tiết học cuối cùng cũng được nghỉ ngơi thì lại bị kéo đến chỗ này.
                  - paragraph: Bên cạnh tôi, Narumi đang vui vẻ nhìn quanh.
                  - paragraph: Tên này bị thừa năng lượng à…?
                  - paragraph: Tôi nhấp một ngụm trà ô long, vừa nhìn quanh vừa nghĩ.
                  - paragraph: Cảnh tượng xung quanh tôi thật lạ thường.
                  - paragraph: Cái “Siêu Cấp Bữa Tiệc Chào Mừng Thành Viên Mới” này khởi đầu khá nghiêm túc. Hội trưởng từng câu lạc bộ đứng dậy nói vài lời, họ cùng nhau nâng ly như thể đang uống champagne luôn ấy.
                  - paragraph: Thế rồi sao lại thành ra thế này?
                  - paragraph: Căn phòng rộng rãi chứa tầm bốn chục người đã trở nên hỗn loạn.
                  - paragraph: Chẳng ai ngồi yên chỗ nào cả, mà đi tán loạn xung quanh như zombie, một tay cầm đồ uống.
                  - paragraph: Mì đã được cho vào lẩu để làm champon, nhưng chẳng ai thèm động đũa, cứ thế mà nở hết ra luôn.
                  - paragraph: Mấy tên trăng hoa thì đang nhiệt tình nói chuyện với hội con gái, cố gắng lớn giọng, còn một hội khác trông như mấy con mọt sách thì túm tụm lại một góc. Cũng có vài cô mang lớp trang điểm dày cộp trên mặt, ngồi cười rồi vỗ tay như mấy con robot – dù tôi chẳng biết họ thấy cái gì hài ở đây nữa.
                  - paragraph: Bọn tôi đang ở trong một quán bar, căn phòng được ngăn cách bởi cửa trượt, và bầu không khí sôi động khiến nơi này trở nên nóng nực và ngột ngạt. Ai cũng lớn tiếng làm tôi có cảm giác khó thở vì quá nhiều CO2 trong này.
                  - paragraph: Tôi kéo cổ áo, cố kiếm tìm chút không khí làm mát mình. Sự nóng nực và khó chịu vượt mức cho phép ở đây khiến tôi muốn ra ngoài.
                  - paragraph: Lúc đó, bỗng có giọng ai đó nghe già hơn rất nhiều bắt đầu lớn tiếng hát “Happy Birthday”. Là từ phòng bên cạnh – phòng cách chỗ tôi một tấm cửa trượt – và bên phòng tôi cũng vỗ tay mà hát theo, như một kiểu đáp lại nào đó vậy.
                  - paragraph: Họ đang cùng tổ chức sinh nhật cho một ai đó hoàn toàn xa lạ, mà cũng chẳng thể thấy mặt luôn.
                  - paragraph: Có lẽ là họ đã yêu cầu chuyện này từ trước, hay là một kiểu flash mob nào đó. Vài người gần tôi còn cố tỏ ra nổi bật khi ngân giọng “Happy Birthdaaaaay…. Toooo yoooou.” lệch nhịp. Hội còn lại không chịu thua, hét lớn “Happy Birthdaaaay!!” đến mức cảm giác như muốn vỡ cả họng. Nếu là flash mob thật thì thế này nghiệp dư quá, nên chắc là do ngẫu hứng rồi.
