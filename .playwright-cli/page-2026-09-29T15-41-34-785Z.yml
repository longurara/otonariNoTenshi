                  - paragraph: “Em xin lỗi, nhưng em đành từ chối thôi!”
                  - paragraph: Một lời từ chối quyết đoán. Vài lời đó đã đủ rồi, thế mà cô còn chêm thêm “Anh không phải gu của em!” một cách vô tình, tàn nhẫn như đánh người đã gục vậy.
                  - paragraph: “Thật à?” Anh chàng vừa bị từ chối hỏi lại, như không tin những gì vừa nghe.
                  - paragraph: “Thật ạ.” Cô trả lời.
                  - paragraph: Căn phòng lại bùng nổ trong tiếng ồn. Tiếng vỗ tay lại vang lên – cả Narumi bên cạnh tôi cũng thế.
                  - paragraph: “Mày đúng là chán òm mà Sorano.” Cậu ta vỗ lưng tôi.
