          - paragraph [ref=f3e164]: Tôi muốn được tiếp tục sống, ngay cả khi bản thân đã chết!
          - paragraph [ref=f3e165]: Anne Frank, ngày 5 tháng 4 năm 1944
          - paragraph [ref=f3e166]: 1. Lần đầu gặp gỡ
          - paragraph [ref=f3e167]: Vị bác sĩ đứng bên giường bệnh, hai tay đặt sau lưng.
          - paragraph [ref=f3e168]: Những đóa hoa đặt trên khung cửa sổ, cánh hoa trắng tản ra trên thân hoa dài mỏng.
          - paragraph [ref=f3e169]: Như pháo hoa bung nở trên bầu trời đêm vậy. Mỗi khi tấm rèm trắng phấp phới vì gió thoảng, tôi lại ngửi thấy mùi hương ngọt ngào từ những bông hoa ấy.
          - paragraph [ref=f3e170]: Vị bác sĩ tiếp lời.
          - paragraph [ref=f3e171]: Tôi đáng ra đã phải chuẩn bị trước khi đối mặt với những lời ấy – nhưng giọng tôi vẫn hòa lẫn vào những giọt nước mắt.
          - paragraph [ref=f3e172]: “Như vậy đã đủ rồi ạ. Dừng lại ở đây thôi.”
          - generic [ref=f3e173]: • • •
          - paragraph [ref=f3e174]: Khi tôi đang gật gù, thì Narumi lớn giọng làm tôi tỉnh lại.
          - paragraph [ref=f3e175]: Hẳn là cậu ta vừa đùa câu gì đó học được ở Kansai. Tôi mở mắt thấy mọi người xung quanh đang vừa cười vừa vỗ tay.
          - paragraph [ref=f3e176]: Hình như tôi vừa lỡ mất một câu đùa của cậu ta nhỉ, mà cũng chẳng sao. Thật ra tôi còn đang thấy hơi bực vì bị đánh thức cơ. Tôi thúc cùi trỏ vào hông khi cậu ta ngồi xuống.
          - paragraph [ref=f3e177]: “Oh, Sorano, tỉnh rồi đấy à.”
          - paragraph [ref=f3e178]: Narumi vỗ lưng tôi vui vẻ.
          - paragraph [ref=f3e179]: “Tao vừa mới có một giấc mơ kỳ lạ lắm.”
          - paragraph [ref=f3e180]: “Kiểu gì?”
          - paragraph [ref=f3e181]: “Kiểu trầm cảm cực.”
          - paragraph [ref=f3e182]: “Ý là sao?”
          - paragraph [ref=f3e183]: Bọn tôi đang ở một bữa tiệc được tổ chức bởi các thành viên thuộc nhiều câu lạc bộ khác nhau để chào đón người mới.
          - paragraph [ref=f3e184]: Tôi ngồi cạnh Narumi – người đã lôi tôi đến đây – trong góc phòng. Ở đây có thể thấy toàn bộ xung quanh.
          - paragraph [ref=f3e185]: Tôi chẳng có chút hứng thú gì với bữa tiệc này cả, lại còn đang thiếu ngủ nữa chứ.
          - paragraph [ref=f3e186]: “Thôi vui lên nào? Mày đã lết được đến đây rồi thì phải tận hưởng đi chứ.”
          - paragraph [ref=f3e187]: “Có phải tao muốn đến đâu. Là mày ép mà.”
          - paragraph [ref=f3e188]: Narumi là bạn cùng phòng ký túc xá đại học của tôi. Cậu ta đã đề xuất ‘dọn dẹp nâng cấp phòng ở’ tối hôm qua, và tôi đã làm quần quật đến tận sáng nay.
          - paragraph [ref=f3e189]: Nhờ đó mà giờ tôi đang cực kỳ buồn ngủ. Cứ nghĩ sau mấy tiết học cuối cùng cũng được nghỉ ngơi thì lại bị kéo đến chỗ này.
          - paragraph [ref=f3e190]: Bên cạnh tôi, Narumi đang vui vẻ nhìn quanh.
          - paragraph [ref=f3e191]: Tên này bị thừa năng lượng à…?
          - paragraph [ref=f3e192]: Tôi nhấp một ngụm trà ô long, vừa nhìn quanh vừa nghĩ.
          - paragraph [ref=f3e193]: Cảnh tượng xung quanh tôi thật lạ thường.
          - paragraph [ref=f3e194]: Cái “Siêu Cấp Bữa Tiệc Chào Mừng Thành Viên Mới” này khởi đầu khá nghiêm túc. Hội trưởng từng câu lạc bộ đứng dậy nói vài lời, họ cùng nhau nâng ly như thể đang uống champagne luôn ấy.
          - paragraph [ref=f3e195]: Thế rồi sao lại thành ra thế này?
          - paragraph [ref=f3e196]: Căn phòng rộng rãi chứa tầm bốn chục người đã trở nên hỗn loạn.
          - paragraph [ref=f3e197]: Chẳng ai ngồi yên chỗ nào cả, mà đi tán loạn xung quanh như zombie, một tay cầm đồ uống.
          - paragraph [ref=f3e198]: Mì đã được cho vào lẩu để làm champon, nhưng chẳng ai thèm động đũa, cứ thế mà nở hết ra luôn.
          - paragraph [ref=f3e199]: Mấy tên trăng hoa thì đang nhiệt tình nói chuyện với hội con gái, cố gắng lớn giọng, còn một hội khác trông như mấy con mọt sách thì túm tụm lại một góc. Cũng có vài cô mang lớp trang điểm dày cộp trên mặt, ngồi cười rồi vỗ tay như mấy con robot – dù tôi chẳng biết họ thấy cái gì hài ở đây nữa.
          - paragraph [ref=f3e200]: Bọn tôi đang ở trong một quán bar, căn phòng được ngăn cách bởi cửa trượt, và bầu không khí sôi động khiến nơi này trở nên nóng nực và ngột ngạt. Ai cũng lớn tiếng làm tôi có cảm giác khó thở vì quá nhiều CO2 trong này.
          - paragraph [ref=f3e201]: Tôi kéo cổ áo, cố kiếm tìm chút không khí làm mát mình. Sự nóng nực và khó chịu vượt mức cho phép ở đây khiến tôi muốn ra ngoài.
          - paragraph [ref=f3e202]: Lúc đó, bỗng có giọng ai đó nghe già hơn rất nhiều bắt đầu lớn tiếng hát “Happy Birthday”. Là từ phòng bên cạnh – phòng cách chỗ tôi một tấm cửa trượt – và bên phòng tôi cũng vỗ tay mà hát theo, như một kiểu đáp lại nào đó vậy.
          - paragraph [ref=f3e203]: Họ đang cùng tổ chức sinh nhật cho một ai đó hoàn toàn xa lạ, mà cũng chẳng thể thấy mặt luôn.
          - paragraph [ref=f3e204]: Có lẽ là họ đã yêu cầu chuyện này từ trước, hay là một kiểu flash mob nào đó. Vài người gần tôi còn cố tỏ ra nổi bật khi ngân giọng “Happy Birthdaaaaay…. Toooo yoooou.” lệch nhịp. Hội còn lại không chịu thua, hét lớn “Happy Birthdaaaay!!” đến mức cảm giác như muốn vỡ cả họng. Nếu là flash mob thật thì thế này nghiệp dư quá, nên chắc là do ngẫu hứng rồi.
          - paragraph [ref=f3e205]: Cảm giác như đang trong sở thú, quan sát các loài khác nhau đang đồng loạt rống lên ấy.
          - paragraph [ref=f3e206]: “Cảm ơn!” giọng một người phụ nữ trẻ vang lên phía bên kia cửa.
          - paragraph [ref=f3e207]: Vài tên bắt đầu đề xuất rằng ngó thử bên kia xem sao – chỉ để nhận lại những ánh mắt lạnh tanh từ hội con gái.
          - paragraph [ref=f3e208]: Ugh…
          - paragraph [ref=f3e209]: “Trông mày có vẻ tệ thật đấy.”
          - paragraph [ref=f3e210]: Có lẽ tôi đã khó chịu ra mặt rồi. Narumi thì vẫn cười làm tôi thấy khó xử hơn nữa.
          - paragraph [ref=f3e211]: “Ai lại không khó chịu chứ?”
          - paragraph [ref=f3e212]: “Có sao đâu? Vui mà.”
          - paragraph [ref=f3e213]: “Tao chẳng thấy chỗ nào vui cả.”
          - paragraph [ref=f3e214]: “Awww…”
          - paragraph [ref=f3e215]: Narumi cũng khiến tôi thấy phiền một chút, nên tôi chỉ về hướng cách bọn tôi hai bàn.
          - paragraph [ref=f3e216]: “Nhìn đi, mày không thấy kiểu đó khó chịu lắm à?”
          - paragraph [ref=f3e217]: Một nhóm con trai đang bao quanh một đứa con gái.
          - paragraph [ref=f3e218]: Chủ đề đã chuyển từ “tham gia câu lạc bộ của anh đi” sang chuyện tình cảm của nhỏ rồi. Và khi đương sự tiết lộ chuyện đang sống một mình và cũng không hẹn hò với ai, thì cuộc nói chuyện trở thành một buổi khoe mẽ bbanr thân hết mức. Nếu cô nàng bảo không thích khói thuốc, cà bọn sẽ dập điếu. Nếu cô nàng thích những đường gân cơ bắp trên cánh tay, họ sẽ xắn hết tay áo lên.
          - paragraph [ref=f3e219]: “Cũng đâu đến nổi? Mày là thánh sống à Sorano?”
          - paragraph [ref=f3e220]: “Đùa nhau à?”
          - paragraph [ref=f3e221]: Narumi chỉ phủi tay. “Nah, có lẽ mày vẫn thuộc kiểu người đó nhỉ.”
          - paragraph [ref=f3e222]: Cậu ta nhìn tôi thông cảm.
          - paragraph [ref=f3e223]: “Ý mày là sao?”
          - paragraph [ref=f3e224]: “Thì là ấy, tự nhìn mày xem. Lưng tựa vào tường, không chịu nhúc nhích gì hết. Trong khi mọi người ở đây đều đang cố gắng xây dựng các mối quan hệ.”
          - paragraph [ref=f3e225]: “Cái sự cố gắng đấy làm tao thấy–“
          - paragraph [ref=f3e226]: Tôi chưa kịp dứt lời, thì có tiếng vỗ tay ở bàn trước.
          - paragraph [ref=f3e227]: “Mọi người chú ý chút được không ạ?”
          - paragraph [ref=f3e228]: Hình như là trưởng câu lạc bộ nào đó, nhưng tôi chả nhớ nổi. Âm nhạc hay thể thao gì đấy. Chắc không phải câu lạc bộ tennis đâu, nhưng mà cũng có thể. Dù sao thì, một anh chàng với mái tóc nâu sáng, tỏa ra toàn khí chất của một trai chơi đứng dậy.
          - paragraph [ref=f3e229]: “Tôi có thông báo quan trọng này cần nói!”
          - paragraph [ref=f3e230]: Giọng anh ta đầy tự tin – kiểu người như chưa từng gặp chuyện gì khó khăn trong cuộc sống ấy. Nói thật thì, tôi thấy khó chịu với cái sự tự tin thái quá đấy. Có lẽ người khác sẽ thấy buồn cười chăng, vì tôi nghe có tiếng cười đâu đây rồi.
          - paragraph [ref=f3e231]: Khoảng lặng anh ta tạo ra thu hút sự chú ý của mọi người… hoặc là do tôi nghĩ thế. Thay vào đó, họ bắt đầu lao vào món champon đã nguội lạnh, tiếng xì xụp nghe được từ khắp các góc phòng.
          - paragraph [ref=f3e232]: Nhưng anh ta nào để chút tiếng ồn này ngăn cản. Dù không thể làm ra vẻ gì hơn nữa, nhưng kiểu gì anh ta cũng phải công bố cái thông báo kia cho bằng được. Dù chẳng biết là anh ta say quá nên không nghe thấy hay tinh thần thép nữa.
          - paragraph [ref=f3e233]: “Năm nhất Yuuko Hayase!”
          - paragraph [ref=f3e234]: Hayase cũng là một trong số những người đang xì xụp kia. Cô ấy ăn nốt miếng mì, mặt như kiểu “huh, mình á?”
          - paragraph [ref=f3e235]: Khi mọi người xung quanh giục, cô đứng dậy, tay che miệng vẫn đang còn nhai. Tay còn lại thì vuốt tóc như thấy khó chịu.
          - paragraph [ref=f3e236]: Những ánh nhìn tò mò đổ dồn vào cô học sinh ấy.
          - paragraph [ref=f3e237]: Anh chàng kia thì đưa tay ra vuốt tóc cô với ánh nhìn chắc chắn, còn cô thì chẳng để tâm chút nào, chỉ láo liên nhìn xung quanh, hẳn là đang xấu hổ. Không có vẻ gì là họ sẽ nhìn vào mắt nhau sớm đâu.
          - paragraph [ref=f3e238]: Anh ta lấy một hơi thật sâu.
          - paragraph [ref=f3e239]: “Anh chưa bao giờ yêu từ cái nhìn đầu tiên, nhưng lần này thì khác. Em sẽ hẹn hò với anh chứ?”
          - paragraph [ref=f3e240]: Tên này nghĩ hắn là ai thế? Ai mà được tỏ tình thế này chắc cũng tởm đến chết thôi.
          - paragraph [ref=f3e241]: Nhưng đám đông xung quanh lại nhiệt tình cổ vũ.
          - paragraph [ref=f3e242]: “Say yes! Say yes!” Họ nói bằng tiếng Anh. Mà cũng chẳng hiểu tại sao nữa.
          - paragraph [ref=f3e243]: “Sao vậy chứ? Hẹn hò với cậu ta đi!” ai đó vô tư nói.
          - paragraph [ref=f3e244]: “Hẹn hò với anh nữa!” một tên khác thì chớp thời cơ.
          - paragraph [ref=f3e245]: Lờ đi những người xung quanh, cô ấy cúi đầu thật sâu.”
          - paragraph [ref=f3e246]: “Em xin lỗi, nhưng em đành từ chối thôi!”
          - paragraph [ref=f3e247]: Một lời từ chối quyết đoán. Vài lời đó đã đủ rồi, thế mà cô còn chêm thêm “Anh không phải gu của em!” một cách vô tình, tàn nhẫn như đánh người đã gục vậy.
          - paragraph [ref=f3e248]: “Thật à?” Anh chàng vừa bị từ chối hỏi lại, như không tin những gì vừa nghe.
          - paragraph [ref=f3e249]: “Thật ạ.” Cô trả lời.
          - paragraph [ref=f3e250]: Căn phòng lại bùng nổ trong tiếng ồn. Tiếng vỗ tay lại vang lên – cả Narumi bên cạnh tôi cũng thế.
          - paragraph [ref=f3e251]: “Mày đúng là chán òm mà Sorano.” Cậu ta vỗ lưng tôi.
          - paragraph [ref=f3e252]: “Tao không hề thích kiểu người thích nổi bật như thế.”
          - paragraph [ref=f3e253]: “Tại sao? Trông vui mà!”
