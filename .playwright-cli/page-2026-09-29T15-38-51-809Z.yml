          - paragraph [ref=f2e375]: “Điều đó làm em cảm thấy thực sự rất hạnh phúc.”
          - paragraph [ref=f2e376]: “Thế sao? Vì lý do gì cơ chứ?”
          - paragraph [ref=f2e377]: “Em chỉ thấy vui vì ngay cả trong khoảng thời gian mình đi vắng, trường đại học của tụi mình vẫn giữ được vẻ náo nhiệt và tràn đầy năng lượng như thế này. Em thực sự rất mừng vì đã có thể trở lại nơi đây. Em không thể ngừng mong đợi và háo hức đón chào mỗi ngày mới trôi qua.”
          - paragraph [ref=f2e378]: Một tiếng nổ đặc biệt lớn vang rền dội qua không gian, gửi một luồng rung chấn chạy dọc khắp cơ thể tôi. Tiếng hò reo cổ vũ từ đám đông khán giả xung quanh càng lúc càng trở nên cuồng nhiệt hơn, chuyển dần từ những tiếng trầm trồ “Ồồồ!” sang những tiếng hét hò vang dội “Wôôôô!”.
          - paragraph [ref=f2e379]: “Kakeru ơi—”
          - paragraph [ref=f2e380]: Làm ơn.
          - paragraph [ref=f2e381]: “—nắm lấy tay em đi.”
          - paragraph [ref=f2e382]: “Được chứ,” anh ấy dịu dàng đáp lời, rồi khẽ đan lòng bàn tay mình vào các đầu ngón tay phải của tôi.
          - paragraph [ref=f2e383]: Những ngón tay ấm áp của Kakeru đan chặt vào tay tôi, và hơi ấm từ cơ thể anh ấy cứ thế từ từ len lỏi, lan tỏa khắp lòng bàn tay.
          - paragraph [ref=f2e384]: Hơi ấm ấy khiến lòng tôi tìm thấy một sự an yên, thanh thản đến lạ kỳ.
          - paragraph [ref=f2e385]: “Này, Kakeru.”
          - paragraph [ref=f2e386]: “Anh nghe đây?”
          - paragraph [ref=f2e387]: “Anh miêu tả những bông pháo hoa cho em nghe được không?”
          - paragraph [ref=f2e388]: “Được chứ.”
          - paragraph [ref=f2e389]: Lại là chất giọng trầm ấm, dịu dàng quen thuộc ấy.
          - paragraph [ref=f2e390]: “Một bông pháo hoa màu vàng vừa mới bung nở thành một hình tròn hoàn hảo kìa.”
          - paragraph [ref=f2e391]: “Là kiểu pháo hoa cúc đại đóa Brocade Chrysanthemum đúng không cậu? Ồ, và em vừa nghe thấy một chuỗi những tiếng nổ liên tiếp nhanh rầm rập — có phải là loạt pháo hoa tầm cao bắn liên thanh không?”
          - paragraph [ref=f2e392]: “Xem ra em cũng bị ảnh hưởng từ anh Kotomugi nhiều rồi đấy nhỉ?”
          - paragraph [ref=f2e393]: “Thì tại vì anh ấy cứ hở ra là lại lôi chủ đề pháo hoa ra nói suốt ngày mà, muốn không tiếp thu một vài kiến thức cũng khó cơ.”
          - paragraph [ref=f2e394]: Cả hai chúng tôi cùng bật cười — nhưng rồi những tiếng nổ của pháo hoa bỗng chốc đột ngột dừng hẳn lại.
          - paragraph [ref=f2e395]: Một làn gió biển ấm áp thổi tới từ phía cảng biển, mùi muối mằn mặn thoang thoảng quyện cùng mùi thuốc súng nồng đậm đặc trưng sau mỗi loạt bắn.
          - paragraph [ref=f2e396]: “Đã kết thúc rồi sao cậu?” tôi hụt hẫng hỏi.
          - paragraph [ref=f2e397]: “Không đâu. Tiếp theo sẽ là những quả pháo hoa do chính các em nhỏ lên ý tưởng thiết kế đấy.”
          - paragraph [ref=f2e398]: Lắng tai nghe kỹ, tôi có thể nhận ra giọng nói của Yuuko từ phía xa. Cậu ấy đang thuyết minh về những tâm nguyện, ước mơ mà các em nhỏ muốn gửi gắm thông qua từng quả pháo hoa của mình.
          - paragraph [ref=f2e399]: Một khoảnh khắc sau đó, tôi nghe thấy tiếng vút xé gió của một quả pháo được phóng lên. Nó bung nở bằng một tiếng nổ lớn đoàng, theo sau đó là những tràng pháo tay tán thưởng rào rào từ khán giả.
          - paragraph [ref=f2e400]: Đó là loại pháo hoa tạo hình — kiểu pháo hoa có thể vẽ nên những bức tranh sinh động trên bầu trời đêm tăm tối.
          - paragraph [ref=f2e401]: Quả pháo vừa rồi mang hình dáng gì nhỉ?
          - paragraph [ref=f2e402]: Có thể là một khuôn mặt cười rạng rỡ chăng? Hay là một hình trái tim đong đầy yêu thương?
          - paragraph [ref=f2e403]: Kakeru khẽ thì thầm vào tai tôi, hơi thở nóng hổi của anh ấy cứ vương vấn mãi nơi vành tai.
          - paragraph [ref=f2e404]: “Những đứa trẻ này đã phải kiên cường chiến đấu với bệnh tật trong một thời gian dài rồi. Việc này có thể không giúp xóa nhòa đi tất cả những gian khổ, đau đớn mà các em phải chịu đựng, nhưng anh hy vọng nó có thể thắp lên một tia sáng ấm áp trong tim các em.”
          - paragraph [ref=f2e405]: Những lời nói đó của cậu ấy thực sự chạm đến sâu thẳm tâm can tôi.
          - paragraph [ref=f2e406]: Nếu không nhờ có màn trình diễn pháo hoa đầu tiên năm ấy, chắc chắn tôi đã không thể có mặt ở đây ngày hôm nay rồi. Tôi không biết phải dùng bao nhiêu lời cảm ơn cho xiết để gửi tới mọi người vì đã biến sự kiện đong đầy hy vọng này trở thành một truyền thống tốt đẹp được duy trì hàng năm.
          - paragraph [ref=f2e407]: “Và bây giờ, quả pháo hoa cuối cùng thuộc về Kakeru Sorano,” Yuuko công bố. “Cậu ấy đã làm nên thứ này cho người bạn gái đã kiên cường chống chọi với bệnh tật.”
          - paragraph [ref=f2e408]: “Ối chà chà!” anh Kotomugi hùa vào chọc ghẹo, làm bộ trêu chọc Kakeru.
          - paragraph [ref=f2e409]: “Khoan đã, anh là người tự tay làm quả pháo hoa này sao?” tôi ngỡ ngàng hỏi.
          - paragraph [ref=f2e410]: “Anh đúng là người tự tay nhồi thuốc súng vào vỏ pháo đấy.”
          - paragraph [ref=f2e411]: Ý của Kakeru chắc hẳn là anh ấy đã tự mình tham gia vào công đoạn đóng gói thuốc súng cho quả pháo hoa này.
          - paragraph [ref=f2e412]: Cái gì cơ?! Anh ấy thực sự đã làm điều đó sao?!
          - paragraph [ref=f2e413]: “Họ đồng ý cho Anh tự tay làm pháo hoa cơ à?”
          - paragraph [ref=f2e414]: “Ừm. Thực sự là vất vả lắm luôn ấy. Anh đã phải mặc bộ đồ bảo hộ lao động rộng thùng thình, và hai cánh tay thì mỏi nhừ ra vì phải dán bao nhiêu là lớp giấy bọc quanh vỏ pháo.”
          - paragraph [ref=f2e415]: “Không thể tin nổi anh lại chịu khó dốc sức làm tất cả những điều đó vì em đấy.”
          - paragraph [ref=f2e416]: “Là để chúc mừng ngày em chính thức trở lại trường đại học mà.”
          - paragraph [ref=f2e417]: Vút. Quả pháo hoa lao thẳng lên không trung rồi bung nở bằng một tiếng nổ vang dội.
          - paragraph [ref=f2e418]: “Là kiểu pháo gì thế?” tôi tò mò hỏi.
          - paragraph [ref=f2e419]: “Đó là một màu đỏ rực rỡ, được gọi là màu đỏ Crimson.”
          - paragraph [ref=f2e420]: “Hẳn là đẹp lắm nhỉ.”
          - paragraph [ref=f2e421]: “Mỗi màu sắc của pháo hoa đều mang một tầng ý nghĩa ẩn giấu đằng sau đó cả đấy, em biết không.”
          - paragraph [ref=f2e422]: “Thế sao?”
          - paragraph [ref=f2e423]: “Sắc đỏ thẫm biểu thị cho ý nghĩa ‘tạo nên sự gắn kết’ đấy.”
          - paragraph [ref=f2e424]: Vừa nói dứt lời, Kakeru lại khẽ siết chặt bàn tay tôi hơn một chút.
          - paragraph [ref=f2e425]: Có lẽ anh ấy đang nói về mối liên kết với tôi. Hy vọng là vậy.
          - paragraph [ref=f2e426]: Làm sao tôi có thể báo đáp lại tình yêu thương bao la mà anh ấy đã dành cho tôi đây? Anh ấy thậm chí còn tự tay làm cả một quả pháo hoa dành riêng cho tôi nữa chứ.
          - paragraph [ref=f2e427]: Sẽ không ngoa chút nào nếu nói rằng chính Kakeru là lý do duy nhất giúp tôi có thêm động lực để tiếp tục níu giữ lấy cuộc sống này.
          - paragraph [ref=f2e428]: Anh ấy đã ban tặng cho tôi một phép màu đích thực. Làm sao người ta có thể trả hết một ân huệ to lớn đến nhường ấy cơ chứ?
          - paragraph [ref=f2e429]: Chỉ cần nghĩ đến điều đó thôi đã làm lòng tôi trào dâng một cảm giác tội lỗi dằn vặt. Tôi vốn dĩ chỉ là một người con gái tầm thường, chẳng có năng lực làm nên những điều kỳ diệu. Không những tôi không thể báo đáp được tấm chân tình ấy, mà tôi sẽ còn tiếp tục nhận lấy sự chăm sóc ích kỷ này và dựa dẫm vào anh ấy dài dài trong tương lai.
          - paragraph [ref=f2e430]: “Hức.”
          - paragraph [ref=f2e431]: Tôi bỗng nghẹn lời.
          - paragraph [ref=f2e432]: “Sao vậy?”
          - paragraph [ref=f2e433]: “Hửm?”
          - paragraph [ref=f2e434]: “Anh mới nghe thấy em nghẹn ngào đấy,” Kakeru nói.
          - paragraph [ref=f2e435]: Tôi vội vàng gạt đi bằng cách khăng khăng rằng không có chuyện gì đâu, rồi nở một nụ cười thật tươi.
          - paragraph [ref=f2e436]: Có vẻ như căn bệnh của tôi gần như là không thể nào chữa khỏi hoàn toàn được. Theo như lời bác sĩ nói, đó là kiểu bệnh mà bạn chỉ có thể cố gắng kéo dài sự sống được ngày nào hay ngày ấy và cố dốc hết sức để trân trọng từng khoảnh khắc thời gian còn lại mà thôi.
          - paragraph [ref=f2e437]: Đồng hồ cát của cuộc đời tôi đang cạn dần từng chút một — vì vậy tôi cần phải tìm cách để báo đáp Kakeru trong lúc bản thân vẫn còn có thể làm được điều gì đó.
          - paragraph [ref=f2e438]: Liệu chỉ việc nói lời “cảm ơn” với anh ấy mỗi ngày có là đủ không nhỉ?
          - paragraph [ref=f2e439]: Hay là phải lặp đi lặp lại câu “Em yêu anh” đến hàng triệu lần?
          - paragraph [ref=f2e440]: Không đâu. Tôi muốn nhiều hơn thế, chứ không chỉ bằng lời nói.
          - paragraph [ref=f2e441]: Thật sự là khó quá đi mà…
          - paragraph [ref=f2e442]: Biết đâu việc nhận được phép màu này là để tôi có thể tìm được cách báo đáp anh ấy? Biết đâu đó là mục đích tối thượng của cuộc đời này thì sao.
          - paragraph [ref=f2e443]: “Anh ước gì chúng ta có thể ở đây mãi mãi,” Kakeru thì thào.
          - paragraph [ref=f2e444]: Tôi cũng vừa nghĩ như vậy.
          - paragraph [ref=f2e445]: Thật hạnh phúc làm sao. Hơi ấm lan tỏa lên đôi gò má, tôi cúi mặt ngượng ngùng, sợ gương mặt đỏ bừng này sẽ bị nhìn thấy.
          - paragraph [ref=f2e446]: Chẳng thể thốt lên lời nào, tôi chỉ siết thật chặt tay Kakeru.
