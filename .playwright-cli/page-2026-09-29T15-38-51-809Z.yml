          - paragraph [ref=f2e132]: “Vì tối nào anh cũng chịu đi dạo với em mà. Xét trên cương vị làm bạn trai thì anh được điểm tối đa nhé.”
          - paragraph [ref=f2e133]: “Hả? À, ừ, ừm.”
