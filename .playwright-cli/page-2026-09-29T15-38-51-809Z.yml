          - paragraph [ref=f2e138]: Tôi đã từng đi qua đây hồi còn nhìn thấy được, nhưng không có nghĩa là tôi nhớ được khung cảnh xung quanh.
          - paragraph [ref=f2e139]: Nên tôi hỏi Kakeru. Mỗi điều Kakeru sẻ chia với tôi lại khiến thế giới của tôi rộng lớn hơn một chút.
          - paragraph [ref=f2e140]: “Biển đang ở trước mặt chúng ta à?”
          - paragraph [ref=f2e141]: Trước mặt tôi là sông Sumida dẫn vào biển. Một con sông cực kỳ lớn và tráng lệ. Ừm – tôi vẫn tưởng tượng ra được.
          - paragraph [ref=f2e142]: “Em thấy được sao?” Kakeru giả vờ ngạc nhiên hỏi.
          - paragraph [ref=f2e143]: “Sao mà được chứ?”
          - paragraph [ref=f2e144]: Tôi bật cười, còn anh ấy thì ngượng ngùng nói, “Đâu có buồn cười đến thế đâu.”
          - paragraph [ref=f2e145]: “Nói cho em biết anh thấy những gì đi, như mọi lần ấy.”
          - paragraph [ref=f2e146]: Kakeru bắt đầu tỉ mỉ vẽ nên khung cảnh trước mắt cho tôi mà không một lời phàn nàn.
          - paragraph [ref=f2e147]: Mặt nước tối thẫm hơn cả trời đêm, chẳng hề phản chiếu dù chỉ một ánh sao. Nguồn sáng duy nhất le lói trên mặt nước là ánh đèn đường và những tòa cao ốc, cứ dập dềnh theo nhịp sóng. Cảnh tượng Kakeru miêu tả khiến tôi liên tưởng đến một bể kính lớn nuôi đầy những con sứa tôi đã từng thấy ở thủy cung.
          - paragraph [ref=f2e148]: “Mặt nước như nào vậy anh?”
          - paragraph [ref=f2e149]: “Đang nhẹ nhàng gợn sóng.”
          - paragraph [ref=f2e150]: “Ánh sáng dập dềnh à... Làm em nghĩ đến sứa ghê.”
          - paragraph [ref=f2e151]: “Anh cũng vừa nghĩ vậy đấy.”
          - paragraph [ref=f2e152]: Đôi lúc, khi hình dung ra những cảnh tượng mà Kakeru kể, tôi lại có cảm giác như đang tạo nên một thế giới riêng của cả hai. Cảm giác đấy thật khó để miêu tả, nhưng nó khiến tôi cực kỳ hạnh phúc.
          - paragraph [ref=f2e153]: Thật tốt khi gặp được anh ấy.
          - paragraph [ref=f2e154]: “Sẵn sàng đi tiếp chưa?” Anh hỏi.
          - paragraph [ref=f2e155]: “Mmm. Thêm một chút nữa đi.” Tôi kéo tay anh ấy.
          - paragraph [ref=f2e156]: Kakeru giữ chặt tay tôi. Cảm giác ấm áp ấy như thể đang được ôm bởi trọn vòng tay vậy.
          - paragraph [ref=f2e157]: “Chờ em nghỉ thêm một chút, rồi chúng ta chạy tiếp nhé?”
          - paragraph [ref=f2e158]: “Huh? Em vẫn muốn chạy tiếp sao?”
          - paragraph [ref=f2e159]: “Vâng. Tại sao không chứ?”
          - paragraph [ref=f2e160]: “Thôi được rồi. Nhưng sau đó thì phải về nghỉ luôn đấy nhé.”
