          - paragraph [ref=f2e112]: “Mmmm. Ấm ghê.”
          - paragraph [ref=f2e113]: “Đừng nói thế chứ, nghe cứ như anh là đồ uống nóng ấy.”
          - paragraph [ref=f2e114]: Tôi bật cười.
          - paragraph [ref=f2e115]: “Ồ.” Kakeru đột nhiên thốt lên.
          - paragraph [ref=f2e116]: “Gì vậy?”
          - paragraph [ref=f2e117]: “Sau lưng bọn mình có vài cây hoa anh đào này. Cánh hoa đang nhảy múa trong không trung đấy.”
          - paragraph [ref=f2e118]: “Có đẹp không?”
          - paragraph [ref=f2e119]: “Đẹp. Thực sự rất đẹp.”
          - paragraph [ref=f2e120]: “Em thích hoa anh đào lắm.”
          - paragraph [ref=f2e121]: “Vào mùa xuân hoa nở đẹp thật nhỉ?”
          - paragraph [ref=f2e122]: “Không chỉ mùa xuân đâu, em thích ở cả bốn mùa cơ.” Tôi nói.
