          - paragraph [ref=f2e59]: "-Hellen Keller-"
          - paragraph [ref=f2e60]: 1. Anh đào trong đêm
          - paragraph [ref=f2e61]: ♬
          - paragraph [ref=f2e62]: Kỳ lạ thật đấy.
          - paragraph [ref=f2e63]: Chẳng hiểu vì sao, mỗi khi sức khỏe chuyển biến xấu, tôi lại muốn được nghe Nhật ký của Anne Frank do Kakeru đọc.
          - paragraph [ref=f2e64]: Lần mò lấy chiếc máy ghi âm, đeo tai nghe vào và ấn nút phát.
          - paragraph [ref=f2e65]: Giọng đọc trẻ trung của Kakeru từ thuở mới gặp nhau sẽ lại vang lên bên tai.
          - paragraph [ref=f2e66]: Chỉ cần tập trung vào từng lời anh ấy đọc, lòng tôi lại tìm lại được sự yên bình.
          - paragraph [ref=f2e67]: ♪
          - paragraph [ref=f2e68]: “Haaah, haaah, haaah.”
          - paragraph [ref=f2e69]: Tiếng Kakeru thở dốc bên cạnh tôi.
          - paragraph [ref=f2e70]: Thình thịch, thình thịch. Tiếng tim đập liên hồi đội vang trong lồng ngực.
          - paragraph [ref=f2e71]: Tôi ôm chặt cánh tay anh ấy khi chạy cùng nhau.
          - paragraph [ref=f2e72]: Vì không thể thấy được, nên Kakeru luôn dẫn tôi theo những con đường dễ đi nhất.
          - paragraph [ref=f2e73]: Sự dịu dàng của anh ấy thể hiện qua từng cử chỉ như vậy.
          - paragraph [ref=f2e74]: “Chào buổi tối,” Anh ấy nói.
          - paragraph [ref=f2e75]: Huh? Tôi thoáng ngỡ ngàng. Anh ấy đang làm gì vậy?
          - paragraph [ref=f2e76]: Nhưng rồi tôi lập tức nhận ra, hẳn là anh đang chào những người đi qua.
          - paragraph [ref=f2e77]: Như vậy, họ sẽ không lấy làm lạ khi thấy tôi chạy. Bởi lẽ, hình ảnh một người khiếm thị tập chạy hẳn là rất hiếm thấy.
          - paragraph [ref=f2e78]: Anh ấy cũng không bắt tôi nép sát vào lề đường hay gì cả, mà để tôi đi lại tự do giữa lối đi.
          - paragraph [ref=f2e79]: Sự tinh tế ấy khiến tôi thấy thật tuyệt làm sao.
          - paragraph [ref=f2e80]: Bấy giờ đang là tháng Tư, trời đêm vẫn còn chút se lạnh. Làn gió lướt qua gò má rồi lùa xuống sau gáy tôi, mang theo hương vị mằn mặn của biển.
          - paragraph [ref=f2e81]: Mỗi bước chân tôi đưa lên nặng trĩu, nâng đỡ toàn bộ trọng lượng cơ thể. Cả cơ thể cảm giác như rã rời. Mới chạy được một đoạn ngắn thôi mà tôi đã thở không ra hơi nữa rồi. Luồng không khí lạnh len lỏi vào như muốn đóng băng phổi.
          - paragraph [ref=f2e82]: “Chúng ta đi bộ một lúc nhé?”
          - paragraph [ref=f2e83]: Có lẽ thấy vẻ mệt mỏi hiện rõ trên mặt tôi, Kakeru chậm lại. Tôi điều chỉnh lại nhịp độ để khớp bước anh.
          - paragraph [ref=f2e84]: “Em vẫn... chạy được mà.” Tôi cố chấp.
          - paragraph [ref=f2e85]: “Em không nên cố quá đâu.” Anh đáp lời, rồi đứng khựng lại.
          - paragraph [ref=f2e86]: Tôi chống tay lên đầu gối, cố gắng điều hòa lại nhịp thở. Khoang miệng bỗng lan tỏa vị kim loại kỳ lạ.
          - paragraph [ref=f2e87]: “Thể lực của em.. thật sự là... tụt dốc tệ hại rồi nhỉ?” tôi hổn hển nói.
          - paragraph [ref=f2e88]: “Cũng phải thôi. Em đã nhập viện lâu vậy rồi mà.”
          - paragraph [ref=f2e89]: Ba năm trước, tôi đã suýt gục ngã trong trận chiến sinh tử với căn bệnh của mình – nhưng Kakeru đã cho tôi hi vọng. Và sau hai năm ròng rã liên tục chiến đấu, tôi đã có thể vượt qua.
          - paragraph [ref=f2e90]: Năm ngoái, tôi trở lại từ Hokkaido và tái nhập học đại học. Như bước đi đầu tiên để lấy lại những gì đã mất, tôi bắt đầu những buổi đi bộ ban đêm cùng Kakeru.
          - paragraph [ref=f2e91]: Hôm nay, chẳng hiểu sao tôi lại cảm giác muốn chạy, nên đã chủ động đề xuất luôn.
          - paragraph [ref=f2e92]: “Em không nên cố quá đâu.” Kakeru đã lo lắng nói vậy, nhưng tôi lại nóng lòng muốn kiểm tra giới hạn của mình đến đâu.
          - paragraph [ref=f2e93]: “Em đã... chạy được bao xa thế?” Tôi hỏi.
          - paragraph [ref=f2e94]: “Ừm, chắc khoảng 50 mét.”
          - paragraph [ref=f2e95]: “Thế thôi á?”
          - paragraph [ref=f2e96]: “Cứ từ từ chậm rãi hồi phục thể lực thôi. Chúng ta ra ghế nghỉ chút nhé?”
          - paragraph [ref=f2e97]: “Vâng.”
          - paragraph [ref=f2e98]: “Ngồi xuống đây nhé. Em chạm được ghế chứ?” Kakeru dẫn tôi đến chỗ ngồi rồi hỏi.
          - paragraph [ref=f2e99]: Tôi khẽ chạm vào ghế rồi ngồi xuống.
          - paragraph [ref=f2e100]: “Cảm ơn anh. Phù, mệt thật đấy.”
          - paragraph [ref=f2e101]: “Nhớ giữ sức nhé.”
          - paragraph [ref=f2e102]: Tôi cảm ơn anh lần nữa.
          - paragraph [ref=f2e103]: Dẫn đường cho tôi dường như đã trở thành bản năng với Kakeru. Tôi chẳng thể nào bày tỏ hết được lòng biết ơn này.
          - paragraph [ref=f2e104]: Ahh, chỉ cần có anh bên cạnh là mình đã thấy hạnh phúc lắm rồi. Trái tim cảm thấy ấm áp đến lạ.
          - paragraph [ref=f2e105]: Bọn tôi ngồi lặng yên giữa làn gió khuya. Không gian tĩnh mịch bao bọc cả hai.
          - paragraph [ref=f2e106]: “Em lạnh à?” Kakeru hỏi
          - paragraph [ref=f2e107]: “Hửm?”
          - paragraph [ref=f2e108]: “Anh thấy em xoa tay vào nhau.”
